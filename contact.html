
<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Website</title>
</head>
<body>
    <header class="upper">   
        <div class="hamburger" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="logo-holder"> <a href="index.html">BISHAL</a></div>
        <ul>
            <li><a href="index.html" >HOME</a></li>
            <li><a href="project.html">PROJECT</a></li>
            <li><a href="contact.html" class="home" >CONTACT</a></li>
            <li><a href="videodemo.html">VIDEO DEMO</a></li>
            <li><a href="sitereport.html">SITE REPORT</a></li>
            
        </ul>
        <ul>
        <li class="cnt"><a href="https://github.com/bishaldh/project-1" class="connect" 
            style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">CONNECT</a></li></ul>
    </header>
    <div class="container">
            <div class="intro">Contact Me</div>
            <form action="https://mail.google.com/mail/u/0/#inbox?compose=new">
                <div class="user">
                    <div class="input">
                        <span class="details"> First Name</span>
                           <input type="text" placeholder="Enter your first name" required>   
                    </div>
                    <div class="input">
                        <span class="details">Last Name</span>
                           <input type="text" placeholder="Enter your last name" required>   
                    </div>
                    <div class="input">
                        <span class="details">Email </span>
                           <input type="email" placeholder="Enter your email" required>   
                    </div>
                    <div class="input">
                        <span class="details"> Phone Number </span>
                           <input type="number" placeholder="Enter your number" required>   
                    </div>
                    <div class="input">
                        <span class="details" id="msg-box"> Message </span>
                           <input type="text" placeholder="Enter the message" required>   
                    </div>
                </div>
                <div class="button">
                    <input type="submit" value="Send">
                </div>
            </form>     
    </div>
    <script>
        function toggleMenu() {
            const menu = document.querySelector('header ul');
            menu.classList.toggle('show-menu');
        }
    </script>
</body>
</html>
